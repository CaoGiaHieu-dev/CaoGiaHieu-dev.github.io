<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ambientIndigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientCyan" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Dark Base Background -->
  <rect width="1200" height="630" fill="#07090e"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="630" fill="url(#ambientIndigo)"/>
  <rect width="1200" height="630" fill="url(#ambientCyan)"/>

  <!-- Subtle Dot Grid Mesh -->
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Outer Frame Subtle Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand Wordmark Icon -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#a5b4fc" text-anchor="middle">GH</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="160" y="112" font-family="'JetBrains Mono', monospace, Consolas" font-size="16" font-weight="600" fill="#818cf8" letter-spacing="1.5">
    FLUTTER DEVELOPER · PUB.DEV AUTHOR
  </text>
  <text x="160" y="134" font-family="'JetBrains Mono', monospace, Consolas" font-size="13" font-weight="400" fill="#64748b">
    Ho Chi Minh City, Vietnam · UTC+7
  </text>

  <!-- Main Name Headline -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Cao Gia Hiếu
  </text>

  <text x="80" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="url(#textGrad)">
    Flutter &amp; Dart Engineer &middot; Open-Source Contributor
  </text>

  <!-- 3 Official Pub.dev Packages Cards Grid -->
  <!-- Card 1: dynamic_logger -->
  <g transform="translate(80, 345)">
    <rect width="325" height="125" rx="18" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">PUB.DEV</text>
    <rect x="225" y="24" width="76" height="24" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="263" y="40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">^0.5.0</text>
    <text x="24" y="74" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#ffffff">dynamic_logger</text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Diagnostic logger &amp; ANSI output</text>
  </g>

  <!-- Card 2: http_security_pinning -->
  <g transform="translate(435, 345)">
    <rect width="330" height="125" rx="18" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#818cf8">PUB.DEV</text>
    <rect x="230" y="24" width="76" height="24" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="268" y="40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">^2.0.0</text>
    <text x="24" y="74" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#ffffff">http_security_pinning</text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">SPKI SHA-256 certificate pinning</text>
  </g>

  <!-- Card 3: refresh_sticky -->
  <g transform="translate(795, 345)">
    <rect width="325" height="125" rx="18" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a78bfa">PUB.DEV</text>
    <rect x="225" y="24" width="76" height="24" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="263" y="40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">^0.1.2</text>
    <text x="24" y="74" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#ffffff">refresh_sticky</text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Sticky pull-to-refresh indicator</text>
  </g>

  <!-- Bottom Badges / Architecture / Social Bar -->
  <g transform="translate(80, 520)">
    <!-- GitHub Badge -->
    <rect width="260" height="42" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#cbd5e1">github.com/CaoGiaHieu-dev</text>

    <!-- Architecture Highlight -->
    <rect x="280" y="0" width="310" height="42" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="300" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#818cf8">flutter-monorepo-codebase</text>

    <!-- Framework Contributor Highlight -->
    <rect x="610" y="0" width="430" height="42" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="630" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399">Google Flutter Contributor (flutter/flutter &amp; packages)</text>
  </g>
</svg>
